server {
    listen 80;
    server_name zeltverleiherfurt.de www.zeltverleiherfurt.de;
    root /usr/share/nginx/html;
    index index.html;

    # ── Statische Website ────────────────────────────────────────
    location = /impressum {
        try_files /impressum.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /datenschutz {
        try_files /datenschutz.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ ^/(impressum|datenschutz)\.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /birthday {
        return 301 /birthday/;
    }

    location / {
        try_files $uri $uri/ =404;
        gzip_static on;
    }

    # ── Spring Boot (Mitarbeiter-App API, ohne /api-Präfix) ───────
    location ~ ^/(booking|material|client|service|statistik|ladepauschale|buchungmaterial|email)(/|$) {
        proxy_pass         http://springboot:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── API → Spring Boot ────────────────────────────────────────
    location ^~ /api/ {
        proxy_pass         http://springboot:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Nur POST /api/anfragen ist öffentlich - alle anderen API-Calls
        # kommen ausschließlich aus dem internen Netz (Admin-Frontend)
        # und brauchen keinen zusätzlichen Schutz hier.
    }

    # ── Admin-Frontend (React) ───────────────────────────────────
    location ^~ /admin/ {
        proxy_pass         http://frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Birthday ─────────────────────────────────────────────────
    location ^~ /birthday/ {
        try_files $uri $uri/ /birthday/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ^~ /css/themes/ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # ── Sicherheits-Header ───────────────────────────────────────
    add_header X-Content-Type-Options  nosniff;
    add_header X-Frame-Options         SAMEORIGIN;
    add_header Referrer-Policy         strict-origin-when-cross-origin;

    # ── Caching für statische Assets ────────────────────────────
    location ~* \.(css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|ico|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
