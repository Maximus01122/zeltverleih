# MySQL Database configuration for XAMPP MySQL
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/zeltverleih
spring.datasource.username=root
# or any user you created
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# for root, password is usually empty by default
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Hibernate settings
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Mail (IONOS SMTP) — Zugangsdaten per Umgebungsvariable (.env)
spring.mail.host=smtp.ionos.de
spring.mail.port=465
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=false

# E-Mail-Benachrichtigung bei neuer Website-Anfrage
app.mail.notification-to=${MAIL_NOTIFICATION_TO:info@zeltverleiherfurt.de}

# Mitarbeiter-Login (Credentials per Umgebungsvariable setzen)
app.auth.username=${AUTH_USERNAME:mitarbeiter}
# Produktion: AUTH_PASSWORD_HASH setzen (BCrypt). Dev-Fallback: AUTH_PASSWORD
app.auth.password-hash=${AUTH_PASSWORD_HASH:}
app.auth.password=${AUTH_PASSWORD:changeme}
app.auth.jwt-secret=${JWT_SECRET:dev-secret-change-in-production-min-32-chars!!}
app.auth.jwt-expiration-ms=28800000
app.auth.login-max-attempts=5
app.auth.login-window-seconds=900