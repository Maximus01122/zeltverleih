version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: zeltverleih
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  springboot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: springboot-app
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/zeltverleih
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      PDF_ANGEBOT_PATH: /app/pdfs/angebot/
      PDF_RECHNUNG_PATH: /app/pdfs/rechnung/
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_NOTIFICATION_TO: ${MAIL_NOTIFICATION_TO:-}
      AUTH_USERNAME: ${AUTH_USERNAME}
      AUTH_PASSWORD: ${AUTH_PASSWORD}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - pdf_data:/app/pdfs
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./src/main/frontend
      dockerfile: Dockerfile
    container_name: react-app
    restart: always
    # Kein öffentlicher Port mehr — Zugriff nur über den website-Proxy unter /admin/
    expose:
      - "80"

  website:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: website
    restart: always
    ports:
      - "0.0.0.0:80:80"
    depends_on:
      - springboot
      - frontend

volumes:
  mysql_data:
  pdf_data:
